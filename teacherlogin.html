<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EcoSocrates - 교사 관리 콘솔 로그인</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Quicksand:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#3d4a3e",
                        "tertiary-container": "#ebbf00",
                        "on-tertiary-fixed": "#231b00",
                        "surface-bright": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "tertiary-fixed": "#ffe083",
                        "background": "#f8f9ff",
                        "on-background": "#0d1c2e",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#7bd0ff",
                        "primary": "#006d36",
                        "surface-tint": "#006d36",
                        "surface": "#f8f9ff",
                        "outline-variant": "#bccabb",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "primary-fixed": "#6dfe9c",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#574500",
                        "on-secondary-fixed": "#001e2c",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#4ade80",
                        "inverse-surface": "#233144",
                        "on-primary-fixed-variant": "#005227",
                        "secondary-fixed": "#c4e7ff",
                        "outline": "#6d7b6d",
                        "primary-fixed-dim": "#4de082",
                        "on-surface": "#0d1c2e",
                        "surface-container-low": "#eff4ff",
                        "surface-container": "#e6eeff",
                        "on-error-container": "#93000a",
                        "surface-dim": "#ccdbf3",
                        "on-primary-fixed": "#00210c",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#eec200",
                        "tertiary": "#735c00",
                        "on-secondary-fixed-variant": "#004c69",
                        "on-tertiary-container": "#624f00",
                        "surface-container-highest": "#d5e3fc",
                        "on-secondary-container": "#004d6a",
                        "on-primary-container": "#005e2d",
                        "secondary": "#00668a",
                        "inverse-primary": "#4de082",
                        "surface-variant": "#d5e3fc"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "40px",
                        "xl": "64px",
                        "md": "24px",
                        "container-max": "800px",
                        "base": "8px",
                        "sm": "12px",
                        "xs": "4px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "chat-bubble": ["Quicksand"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Quicksand"],
                        "body-lg": ["Quicksand"],
                        "label-bold": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "chat-bubble": ["17px", {"lineHeight": "26px", "fontWeight": "500"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "500"}],
                        "label-bold": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .seed-button-shadow {
            box-shadow: 0 4px 0px 0px #005227;
        }
        .seed-button-shadow:active {
            box-shadow: 0 0px 0px 0px #005227;
            transform: translateY(4px);
        }
        .glass-background {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col items-center justify-center p-gutter relative overflow-hidden">
<!-- Atmospheric Background Elements -->
<div class="absolute top-[-10%] left-[-5%] w-[400px] h-[400px] bg-primary-container/20 rounded-full blur-[100px] -z-10 animate-pulse"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[500px] h-[500px] bg-secondary-container/15 rounded-full blur-[120px] -z-10 animate-pulse" style="animation-delay: 2s;"></div>
<!-- Login Container -->
<main class="w-full max-w-[480px] z-10">
<!-- Header Section -->
<div class="text-center mb-xl">
<div class="inline-flex items-center gap-2 mb-sm">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">eco</span>
<span class="font-headline-lg text-headline-lg text-primary tracking-tight">EcoSocrates</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-background mb-xs">교사 관리 콘솔 로그인</h1>
<p class="font-body-md text-on-surface-variant">프롬프트 만들기 챗봇: 교육자 전용 포털</p>
</div>
<!-- Login Card -->
<section class="glass-background border border-white/40 rounded-lg p-lg shadow-sm">
<form class="space-y-md" id="loginForm">
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant px-1" for="email">이메일 주소</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-2 border-outline-variant rounded-full focus:border-primary focus:ring-0 transition-all font-body-md" id="email" placeholder="name@school.edu" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant px-1" for="password">비밀번호</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-lowest border-2 border-outline-variant rounded-full focus:border-primary focus:ring-0 transition-all font-body-md" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<div class="pt-2">
<button class="w-full py-4 bg-primary text-on-primary font-label-bold text-headline-md rounded-full seed-button-shadow transition-all flex items-center justify-center gap-2 hover:brightness-110" type="submit">
<span class="material-symbols-outlined">login</span>
                        로그인하기
                    </button>
</div>
</form>
<!-- Secondary Actions -->
<div class="mt-lg flex items-center justify-between px-2">
<a class="font-label-bold text-label-bold text-secondary hover:underline" href="#">비밀번호 찾기</a>
<div class="w-[1px] h-4 bg-outline-variant mx-4"></div>
<a class="font-label-bold text-label-bold text-primary hover:underline" href="#">교사 회원가입</a>
</div>
</section>
<!-- Back to Student Link -->
<div class="mt-xl text-center">
<a class="inline-flex items-center gap-2 font-label-bold text-label-bold text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                학생 로그인으로 돌아가기
            </a>
</div>
</main>
<!-- Decorative Illustration (Bento Style) -->
<div class="hidden lg:grid grid-cols-2 gap-4 fixed bottom-lg left-lg w-[320px] opacity-40">
<div class="bg-surface-container-high rounded-lg p-4 flex items-center justify-center aspect-square">
<span class="material-symbols-outlined text-[48px] text-primary">analytics</span>
</div>
<div class="bg-tertiary-fixed rounded-lg p-4 flex items-center justify-center aspect-square">
<span class="material-symbols-outlined text-[48px] text-tertiary">monitoring</span>
</div>
<div class="bg-primary-fixed rounded-lg p-4 flex items-center justify-center aspect-square">
<span class="material-symbols-outlined text-[48px] text-on-primary-fixed-variant">assignment</span>
</div>
<div class="bg-surface-container-highest rounded-lg p-4 flex items-center justify-center aspect-square">
<img alt="Educational tools" class="w-12 h-12 object-contain opacity-50" data-alt="A clean, minimalist 3D isometric illustration of a teacher's desk with an open laptop showing a growth chart, surrounded by floating green leaves and tiny solar panel icons. The style is modern soft-minimalism with a warm color palette of Leaf Green, Sky Blue, and Solar Yellow, set against a bright, airy white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFw9b19Z8aTw7Mf1vqSRw0Z3e0WHwbaW08nxdyaJm3buGFmukBQEyGdNGAgkFnQIFow1VeoTtqmCkHUwen4AuUxN5MIoR4dpDxJxeVsSEc82jUm08adVsUxa0jfTj2I3ZltFNr86YLlkG9ITWmFyCQ5CN4FKJTfB_Sjy1tQN_sW-z09mhA0YxKR7YnsJCRdSHtLEeFAU9kLnVPah_JdsAtEOJ6RqxBWZu5yHpOnsU8rlh94jAQ1O794MtrEfVskLYry4-JSz9GaQs"/>
</div>
</div>
<!-- Floating Graphic (Right Side) -->
<div class="hidden lg:block fixed top-1/2 right-[-100px] -translate-y-1/2 w-[400px] h-[600px] bg-secondary-fixed-dim/10 rounded-[4rem] rotate-12 -z-10 overflow-hidden">
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-[300px] text-secondary/5 rotate-[-12deg]" style="font-variation-settings: 'wght' 100;">school</span>
</div>
</div>
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Micro-interaction for form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> 처리 중...';
            btn.classList.add('opacity-80');
            btn.disabled = true;
            
            setTimeout(() => {
                // In a real app, logic would go here
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> 환영합니다!';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-secondary');
            }, 1500);
        });
    </script>
</body></html>
